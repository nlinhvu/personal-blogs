name: site-preview

# No `paths` filter on purpose. This workflow's `preview` job is a REQUIRED
# status check on main, and GitHub treats a required check that never reports as
# pending forever — so a path-filtered required check makes every pull request
# that misses those paths unmergeable. Running on every pull request costs about
# forty seconds and removes that whole class of deadlock, while also building and
# testing the site before any change lands, infrastructure changes included.
on:
  pull_request:

permissions: {}

env:
  PREVIEW_URL: https://blog-preview.vulinh.workers.dev

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-site
        with:
          site-url: ${{ env.PREVIEW_URL }}
          is-dev: "true"
      # `npm test` runs the scripts suite, then builds a SECOND site, from
      # test/fixtures/content into dist-test/, and runs the site suite against
      # that. It no longer touches the dist/ built above. IS_DEV is still passed
      # on: the draft assertions read X-Robots-Tag off the response to decide
      # which half of the rule to check.
      - run: npm test
        env:
          SITE_URL: ${{ env.PREVIEW_URL }}
          IS_DEV: "true"
      - run: npx wrangler deploy --env preview
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test preview
        run: |
          set -euo pipefail
          .github/scripts/wait-for-http-200.sh "$PREVIEW_URL/"
          # Fetch then match, for the reason spelled out in site-deploy.yml.
          headers=$(curl -sSI "$PREVIEW_URL/")
          grep -qi 'x-robots-tag: noindex, nofollow' <<<"$headers" \
            || { echo "FAIL: preview is indexable"; exit 1; }
          echo "preview smoke passed"
