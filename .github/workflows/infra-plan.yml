name: infra-plan

on:
  pull_request:
    paths:
      - "infra/**"
      # The pipeline tests itself; see site-preview.yml for the reasoning.
      - ".github/workflows/infra-plan.yml"

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [prod, dev]
    environment: infra-${{ matrix.env }}-plan
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          # The wrapper re-emits tofu output through its own reporter, which
          # corrupts the redirect below. Scripted use wants the raw binary.
          tofu_wrapper: false
      - name: Plan
        id: plan
        working-directory: infra/envs/${{ matrix.env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          tofu init -input=false
          # -lock=false: a plan reads state, so it must never block an apply
          # that is running at the same time.
          tofu plan -input=false -no-color -lock=false > "$RUNNER_TEMP/plan.txt"
          # A GitHub comment caps at 65536 characters. Keep the head of a long
          # plan rather than failing the step on a body that is too large.
          head -c 60000 "$RUNNER_TEMP/plan.txt" > "$RUNNER_TEMP/plan-trimmed.txt"
          {
            echo "## \`tofu plan\` — ${{ matrix.env }}"
            echo '```'
            cat "$RUNNER_TEMP/plan-trimmed.txt"
            echo '```'
            if [ "$(wc -c < "$RUNNER_TEMP/plan.txt")" -gt 60000 ]; then
              echo
              echo "_Plan truncated at 60000 characters. Read the full output in the job log._"
            fi
          } > "$RUNNER_TEMP/comment.md"
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.number }}" --body-file "$RUNNER_TEMP/comment.md"
