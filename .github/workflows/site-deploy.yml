name: site-deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      # The pipeline tests itself. Without these, a change to the workflow,
      # its composite action or its helper scripts merges without ever running,
      # and a broken pipeline is only discovered on the next content change.
      - ".github/workflows/site-deploy.yml"
      - ".github/actions/build-site/**"
      - ".github/scripts/**"

permissions: {}

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-site
        with:
          site-url: ${{ vars.STAGING_URL }}
          is-dev: "true"
      # `npm test` builds a SECOND site, from test/fixtures/content into
      # dist-test/, so it no longer touches the dist/ built above. IS_DEV is
      # still passed on: the draft assertions read X-Robots-Tag off the response
      # to decide which half of the rule to check, so this is what exercises the
      # "a draft IS served on a non-indexed build" branch.
      - run: npm test
        env:
          SITE_URL: ${{ vars.STAGING_URL }}
          IS_DEV: "true"
      - id: deploy
        run: |
          npx wrangler deploy --env staging
          echo "url=${{ vars.STAGING_URL }}" >> "$GITHUB_OUTPUT"
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test staging
        run: |
          set -euo pipefail
          URL="${{ vars.STAGING_URL }}"
          .github/scripts/wait-for-http-200.sh "$URL/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/vi")" = "200"
          # Fetch then match, for the reason spelled out in the production job.
          headers=$(curl -sSI "$URL/")
          grep -qi 'x-robots-tag: noindex, nofollow' <<<"$headers" \
            || { echo "FAIL: staging is indexable"; exit 1; }
          echo "staging smoke passed"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-site
        with:
          site-url: https://vulinh.dev
          is-dev: "false"
      - run: npx wrangler deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          set -euo pipefail
          .github/scripts/wait-for-http-200.sh https://vulinh.dev/

          # Fetch first, match second. `curl ... | grep -q` reads tidier and is
          # a trap: grep exits at the first match, curl keeps writing into a
          # closed pipe, and the resulting `curl: (23)` is promoted to a failed
          # job by pipefail. It stayed hidden for as long as the post under test
          # was a 68-word stub that fitted the pipe buffer whole, and fired the
          # first time a real 1,600-word article took its place — with the
          # canonical link, the thing being matched, sitting in <head>.
          #
          # -H 'Accept: text/html' is load-bearing on the home page: Cloudflare
          # injects the Web Analytics beacon at the edge only for requests that
          # accept HTML, so a bare curl gets no script and would fail the beacon
          # check below for the wrong reason.
          #
          # The slug is a real published post, not a fixture — this asserts the
          # deployed site. If that post is ever unpublished, this moves with it.
          post=$(curl -sS https://vulinh.dev/blog/reading-a-ds-record)
          home=$(curl -sS https://vulinh.dev/ -H 'Accept: text/html')
          headers=$(curl -sSI https://vulinh.dev/)

          grep -q 'rel="canonical" href="https://vulinh.dev/blog/reading-a-ds-record"' <<<"$post" \
            || { echo "FAIL: canonical link wrong, or the post is no longer served"; exit 1; }
          grep -qi 'x-content-type-options: nosniff' <<<"$headers" \
            || { echo "FAIL: nosniff header is missing from production"; exit 1; }
          if grep -qi 'x-robots-tag' <<<"$headers"; then
            echo "FAIL: production is de-indexed"; exit 1
          fi
          # Web Analytics is switched on in the dashboard, not in OpenTofu: the
          # infra token cannot read /rum/site_info even with Account Analytics
          # granted, so declaring it made every apply fail. This is the
          # replacement tripwire. Matching `<script ...>` rather than the bare
          # host is load-bearing and was measured, not assumed: the host also
          # appears in the CSP meta tag this site emits on every page, so a
          # bare-host match could never fail — worse than having no check.
          grep -qE '<script[^>]*static\.cloudflareinsights\.com' <<<"$home" \
            || { echo "FAIL: web analytics beacon is gone from production"; exit 1; }

          # The card is the first thing a stranger sees of this blog. It fails
          # in a way nobody notices -- the unfurl still renders, just wrong or
          # blank -- so it gets a real assertion rather than a glance. Same
          # real-slug trade-off as the canonical check above: if that post is
          # ever unpublished, these three lines move with it.
          og=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
            https://vulinh.dev/og/blog/reading-a-ds-record.png)
          test "$og" = "200 image/png" \
            || { echo "FAIL: open graph image is $og"; exit 1; }
          vi=$(curl -sS https://vulinh.dev/vi/blog/reading-a-ds-record)
          grep -q 'property="og:image" content="https://vulinh.dev/og/vi/blog/' <<<"$vi" \
            || { echo "FAIL: the Vietnamese post advertises the wrong card"; exit 1; }
          grep -q '"@type":"BlogPosting"' <<<"$vi" \
            || { echo "FAIL: structured data is missing"; exit 1; }
          echo "production smoke passed"
