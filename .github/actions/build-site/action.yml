name: Build site
description: Install pinned dependencies and build the Astro site
inputs:
  site-url:
    description: Absolute site URL used for canonical links and feed GUIDs
    required: true
  is-dev:
    description: "true when the build targets staging or preview"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
        cache: npm
    - shell: bash
      run: npm ci
    - shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
        IS_DEV: ${{ inputs.is-dev }}
      run: npm run build
