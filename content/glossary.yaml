# Terms the translator must render consistently.
#
# Add a line every time a review turns up a term translated badly. That is the
# whole maintenance model: this file grows from real mistakes, not from
# guessing which words might one day be a problem.
#
# House rule: English technical terms stay in English. A Vietnamese engineer
# searches for "virtual thread", not for a translation of it, and a post that
# invents Vietnamese names for standard terms is harder to read, not easier.
- en: "virtual thread"
  vi: "virtual thread"
  note: "Keep in English. Never translate to 'luồng ảo'."
- en: "garbage collection"
  vi: "garbage collection"
  note: "Keep in English."
- en: "throughput"
  vi: "throughput"
  note: "Keep in English."
- en: "latency"
  vi: "latency"
  note: "Keep in English."
- en: "deadlock"
  vi: "deadlock"
  note: "Keep in English."
- en: "backpressure"
  vi: "backpressure"
  note: "Keep in English."
- en: "trade-off"
  vi: "đánh đổi"
- en: "under the hood"
  vi: "bên dưới"
  note: "Plain wording. Not 'dưới nắp capo'."
